
name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Temukan proyek
        id: loc
        run: |
          if [ -f ZuhudVideoEditor.zip ]; then
            mkdir -p _unzipped
            unzip -q -o ZuhudVideoEditor.zip -d _unzipped
            ROOT=_unzipped
          else
            ROOT=.
          fi

          SETTINGS=$(find "$ROOT" -name settings.gradle.kts | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "settings.gradle.kts tidak ditemukan"
            exit 1
          fi

          DIR=$(dirname "$SETTINGS")
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Build APK
        working-directory: ${{ steps.loc.outputs.dir }}
        run: gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: ZuhudVideoEditor-debug-apk
          path: ${{ steps.loc.outputs.dir }}/app/build/outputs/apk/debug/*.apk
